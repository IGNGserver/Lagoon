name: 发布 Lagoon Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本 tag，例如 v0.1.0-rc.1'
        required: true
        type: string
      release_type:
        description: '发布类型；未明确指定时使用 pre-release'
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TYPE: ${{ inputs.release_type || 'pre-release' }}
    steps:
      - name: 检出版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析产物名称
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "版本号包含不适合作为文件名或 URL 的字符：$version" >&2
            exit 1
          fi
          name="Lagoon-${version}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "APK 发布产物名称：${name}"

      - name: 设置 Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 注入签名
        env:
          KEYSTORE_BASE64: ${{ secrets.LAGOON_KEYSTORE_BASE64 || secrets.OPENCODE_LAGOON_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "预发布和正式版都需要稳定签名" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lagoon-release.jks"
          echo "LAGOON_KEYSTORE_FILE=$RUNNER_TEMP/lagoon-release.jks" >> "$GITHUB_ENV"

      - name: 构建并验证 Android
        timeout-minutes: 25
        env:
          LAGOON_KEYSTORE_PASSWORD: ${{ secrets.LAGOON_KEYSTORE_PASSWORD || secrets.OPENCODE_LAGOON_KEYSTORE_PASSWORD }}
          LAGOON_KEY_ALIAS: ${{ secrets.LAGOON_KEY_ALIAS || secrets.OPENCODE_LAGOON_KEY_ALIAS }}
          LAGOON_KEY_PASSWORD: ${{ secrets.LAGOON_KEY_PASSWORD || secrets.OPENCODE_LAGOON_KEY_PASSWORD }}
          LAGOON_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          set -euo pipefail
          export LAGOON_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          export LAGOON_VERSION_NAME="${RELEASE_TAG#v}"
          echo "LAGOON_VERSION_CODE=$LAGOON_VERSION_CODE" >> "$GITHUB_ENV"
          echo "LAGOON_VERSION_NAME=$LAGOON_VERSION_NAME" >> "$GITHUB_ENV"
          ANDROID_HOME="$ANDROID_SDK_ROOT" ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: 定位构建产物
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(./gradlew -q :app:printReleaseApkPath)
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "APK 不存在" >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: 校验产物（非调试、固定证书）
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.LAGOON_SIGNING_CERT_SHA256 || secrets.OPENCODE_LAGOON_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.path }}"
          build_tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          if "$build_tools/aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "发布产物不应是 debuggable：$apk" >&2
            exit 1
          fi
          if ! "$build_tools/apksigner" verify --print-certs "$apk" > signing.txt 2>&1; then
            echo "apksigner 无法验证发布 APK" >&2
            cat signing.txt >&2
            exit 1
          fi
          if grep -q "CN=Android Debug" signing.txt; then
            echo "正式版不能使用调试签名" >&2
            exit 1
          fi
          test -n "$EXPECTED_CERT" || { echo "缺少固定证书指纹" >&2; exit 1; }
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "发布配置的 SHA-256 指纹格式无效" >&2
            exit 1
          fi
          actual_digests=$(sed -nE 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+)$/\1/p' signing.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ -z "$actual_digests" ]]; then
            echo "无法从 apksigner 输出解析证书 SHA-256 指纹" >&2
            cat signing.txt >&2
            exit 1
          fi
          while IFS= read -r actual; do
            if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then
              echo "apksigner 返回无效的证书 SHA-256 指纹" >&2
              cat signing.txt >&2
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "签名证书与发布配置不匹配" >&2
              echo "产物证书 SHA-256：$actual" >&2
              exit 1
            fi
          done <<< "$actual_digests"
          echo "签名及非调试产物检查通过"

      - name: 准备版本化 APK 产物
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.path }}"
          name="${{ steps.asset.outputs.name }}"
          mkdir -p release-assets
          cp "$apk" "release-assets/${name}"
          echo "path=release-assets/${name}" >> "$GITHUB_OUTPUT"
          echo "已准备 ${name}"

      - name: 生成中文 Release 说明
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -f "$notes" ]]; then
            echo "缺少中文版本说明：$notes" >&2
            exit 1
          fi
          apk_name="${{ steps.asset.outputs.name }}"
          apk_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_name}"
          {
            echo "# Lagoon ${RELEASE_TAG}"
            echo
            if [[ "$RELEASE_TYPE" == "release" ]]; then
              echo "这是 Lagoon 正式版本。"
            else
              echo "这是 Lagoon 预发布版本，用于验证本次更新。"
            fi
            echo
            echo "## 本次更新"
            echo
            # 版本说明文件以「## 本次更新」开头，这里只保留其后的正文，避免标题重复。
            # 同时去掉正文前的空行，确保 Markdown 段落紧凑。
            sed -e '1{/^## 本次更新[[:space:]]*$/d;}' -e '/[^[:space:]]/,$!d' "$notes"
            echo
            echo "## 下载"
            echo
            echo "- **Android 安装包** — [${apk_name}](${apk_url})"
            echo
            echo "## 自动验证"
            echo
            echo "- Android 单元测试和 APK 构建已由 GitHub Actions 执行。"
          } > release-notes.md

      - name: 发布 GitHub Release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_asset="${{ steps.artifact.outputs.path }}"
          apk_name="${{ steps.asset.outputs.name }}"
          flags=()
          if [[ "$RELEASE_TYPE" == "pre-release" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          # 发布必须可重入：上一次运行在「已推 tag」之后失败或超时，
          # tag 就停在「只有 tag、Release 页面找不到」的状态。重跑同一 tag 时改为更新既有 Release 并覆盖产物，
          # 而不是让 gh release create 因 Release 已存在而报错退出。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，按幂等更新处理"
            gh release edit "$RELEASE_TAG" --title "Lagoon ${RELEASE_TAG}" --notes-file release-notes.md "${flags[@]}"
            gh release upload "$RELEASE_TAG" "$apk_asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk_asset" --title "Lagoon ${RELEASE_TAG}" --notes-file release-notes.md --verify-tag "${flags[@]}"
          fi
          # 显式核对发布结果，缺失时以失败结束，不要出现「工作流成功但 Release 页面没有版本」。
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,isDraft,url,assets \
            --jq '"已发布 \(.tagName)（isPrerelease=\(.isPrerelease)，isDraft=\(.isDraft)）：\(.url)，产物：\([.assets[].name] | join(", "))"'
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx -- "$apk_name"; then
            echo "Release 上缺少 APK 产物：$apk_name" >&2
            exit 1
          fi

      - name: 触发官网自动部署
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=release-published

      - name: 发布结果提示
        if: failure()
        shell: bash
        run: |
          echo "版本 tag ${RELEASE_TAG} 可能只有 tag、没有 GitHub Release。" >&2
          echo "请到 Actions 里对本仓库重新手动运行本工作流并填写 tag=${RELEASE_TAG}（发布步骤已幂等，可安全重跑）。" >&2

      - name: 清理 runner 签名材料
        if: always()
        run: rm -f "$RUNNER_TEMP/lagoon-release.jks" "$RUNNER_TEMP/opencode-release.jks"
