name: 中枢与网页

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'hub/**'
      - 'web/**'
      - 'contract/**'
      - 'deploy/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.dockerignore'
      - '.github/workflows/hub-web.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'hub/**'
      - 'web/**'
      - 'contract/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    name: 中枢测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 设置 Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 中枢单元与接口测试
        env:
          LAGOON_HUB_ONLY: '1'
        run: ./gradlew --console=plain :hub:test :hub:installDist

  web:
    name: 网页检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 设置 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 安装依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint、类型检查、单元测试与构建
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  image:
    name: 镜像构建与健康检查
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [hub, web]
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 构建镜像（amd64）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: lagoon-hub:ci
          build-args: LAGOON_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并检查登录页与健康状态
        run: |
          set -euo pipefail
          docker run -d --name hub -p 8080:8080 -e LAGOON_PASSWORD=ci lagoon-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | grep -q '"display": "standalone"'
          curl -fsS http://127.0.0.1:8080/api/v1/auth/status | grep -q '"authenticated":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/state)" = 401
          docker inspect --format '{{.State.Health.Status}}' hub || true

      - name: 容器日志
        if: always()
        run: docker logs hub || true
