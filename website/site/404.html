<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>迷航了 — Lagoon</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030816">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .lost { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
    .lost svg { width: 72px; height: 72px; margin: 0 auto 28px; filter: drop-shadow(0 0 24px rgba(89, 210, 230, 0.5)); }
    .lost h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1.15; }
    .lost p { margin: 18px auto 34px; max-width: 420px; color: var(--mist); }
    .lost .eyebrow { justify-content: center; }
  </style>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="markGrad" x1="8" y1="40" x2="42" y2="8" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#4f5bea"/><stop offset="1" stop-color="#59d2e6"/>
      </linearGradient>
    </defs>
    <symbol id="mark" viewBox="0 0 48 48">
      <path d="M35 13C32.9 10.8 29.8 9.5 26.2 9.5H20C13.9 9.5 9 14.4 9 20.5V27.5C9 33.6 13.9 38.5 20 38.5H28.5C32.2 38.5 35.4 36.7 37.3 33.8" fill="none" stroke="url(#markGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33.5 22H37.5L43 27.5L37.5 33H33.5L39 27.5Z" fill="#59d2e6"/>
      <circle cx="39" cy="9" r="3" fill="#52e0c4"/>
    </symbol>
  </svg>
  <div class="ocean-fallback" aria-hidden="true"></div>
  <main class="lost">
    <div>
      <svg aria-hidden="true"><use href="#mark"/></svg>
      <p class="eyebrow"><span class="eyebrow__depth">404</span>深度未知</p>
      <h1>这片水域没有航标。</h1>
      <p>你要找的页面不存在，或者已经随潮水漂走了。</p>
      <a class="btn btn--primary" href="/">回到海面</a>
    </div>
  </main>
</body>
</html>
